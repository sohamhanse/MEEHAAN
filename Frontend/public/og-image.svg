<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#050805"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M 58 0 L 0 0 0 58" fill="none" stroke="rgba(212,245,101,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#184D3A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050805" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="315" rx="520" ry="340" fill="url(#glow)"/>

  <!-- Logo mark (bowtie M) centered left -->
  <!-- Left chevron arm -->
  <path d="M174,178 Q174,130 218,130 L310,262 L218,394 Q174,394 174,346 Z" fill="#F5921E"/>
  <!-- Right chevron arm -->
  <path d="M446,178 Q446,130 402,130 L310,262 L402,394 Q446,394 446,346 Z" fill="#F5921E"/>
  <!-- 3D fold shadow -->
  <path d="M310,262 L402,394 Q446,394 446,346 L446,306 Z" fill="#C07010"/>

  <!-- MEEHAAN wordmark -->
  <text x="510" y="290" font-family="'Syne','Arial Black',sans-serif" font-size="96" font-weight="800" fill="#F4F7F1" letter-spacing="-2">MEEHAAN</text>

  <!-- Tagline -->
  <text x="512" y="348" font-family="'DM Sans','Arial',sans-serif" font-size="26" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="0.5">Industrial Solutions</text>

  <!-- Bottom accent line -->
  <rect x="510" y="390" width="120" height="3" rx="2" fill="#F5921E"/>
</svg>
